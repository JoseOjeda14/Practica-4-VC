task: detection
num_classes: 1
remap_mscoco_category: false

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

train_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: C:/Users/josem/Desktop/images
    ann_file: C:/Users/josem/Desktop/train.json
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
        - {type: SanitizeBoundingBox, min_size: 1}
  shuffle: true
  total_batch_size: 4
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: C:/Users/josem/Desktop/images
    ann_file: C:/Users/josem/Desktop/val.json
    transforms:
      type: Compose
      ops: 
        - {type: Resize, size: [640, 640]}
        - {type: ToImageTensor}
        - {type: ConvertDtype}
  shuffle: false
  total_batch_size: 32
  num_workers: 4
  collate_fn:
    type: BatchImageCollateFunction